services:
  - type: web
    name: loaflink
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn bs.wsgi:application --bind 0.0.0.0:$PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "loaflink.onrender.com"
      - key: DATABASE_URL
        sync: false       # ← will be set manually in Render dashboard